---
name: ci

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  packages: read
  pull-requests: read
  security-events: write

jobs:
  lint:
    env:
      GOWORK: "off"
    strategy:
      fail-fast: false
      matrix:
        module: [ftp, irc, sftp, torrent]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          working-directory: ${{ matrix.module }}

  test:
    env:
      GOWORK: "off"
    strategy:
      fail-fast: false
      matrix:
        module: [ftp, irc, sftp, torrent]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go vet ./...
        working-directory: ${{ matrix.module }}
      - run: go test -race ./...
        working-directory: ${{ matrix.module }}

  lint-commits:
    if: github.event_name == 'pull_request'
    uses: natalie-o-perret/.github/.github/workflows/reusable-lint-commits-conventional.yml@main
    permissions:
      pull-requests: read

  lint-json:
    uses: natalie-o-perret/.github/.github/workflows/reusable-lint-files-json.yml@main

  lint-markdown:
    uses: natalie-o-perret/.github/.github/workflows/reusable-lint-files-md.yml@main

  lint-yaml:
    uses: natalie-o-perret/.github/.github/workflows/reusable-lint-files-yaml.yml@main

  codeql:
    uses: natalie-o-perret/.github/.github/workflows/reusable-codeql.yml@main
    with:
      language: go
      go-version-file: go.work
